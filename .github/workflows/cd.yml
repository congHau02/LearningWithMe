name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Backend (ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.full }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve lowercase GHCR image name
        id: image
        run: |
          OWNER=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          NAME="ghcr.io/${OWNER}/study-together-backend"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "full=${NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.full }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vm:
    name: Deploy to Oracle ARM VM
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.prod.yml
            deploy/Caddyfile

      - name: Configure SSH and deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_PORT: ${{ vars.VM_SSH_PORT || '22' }}
          VM_APP_DIR: ${{ vars.VM_APP_DIR || '/opt/learningwithme' }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$VM_HOST" ] || [ -z "$VM_USER" ] || [ -z "$VM_SSH_KEY" ]; then
            echo "::error::Missing VM_HOST, VM_USER, or VM_SSH_KEY secret. Run scripts/setup-prod-infra.sh first."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          SSH_OPTS="-p $VM_SSH_PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
          SCP_OPTS="-P $VM_SSH_PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"

          ssh $SSH_OPTS "$VM_USER@$VM_HOST" "mkdir -p '$VM_APP_DIR/deploy'"
          scp $SCP_OPTS docker-compose.prod.yml "$VM_USER@$VM_HOST:$VM_APP_DIR/docker-compose.prod.yml"
          scp $SCP_OPTS deploy/Caddyfile "$VM_USER@$VM_HOST:$VM_APP_DIR/deploy/Caddyfile"

          ssh $SSH_OPTS "$VM_USER@$VM_HOST" bash -s <<EOF
          set -euo pipefail
          cd "$VM_APP_DIR"
          if [ ! -f .env ]; then
            echo "Missing $VM_APP_DIR/.env on VM. Run scripts/setup-prod-infra.sh and upload .env first." >&2
            exit 1
          fi
          chmod 600 .env
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          export BACKEND_IMAGE="$BACKEND_IMAGE"
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          for i in \$(seq 1 24); do
            STATUS=\$(docker inspect --format '{{.State.Health.Status}}' "\$(docker compose -f docker-compose.prod.yml ps -q backend)" 2>/dev/null || echo "starting")
            if [ "\$STATUS" = "healthy" ]; then
              echo "Backend container is healthy."
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --tail=50 backend
          exit 1
          EOF
