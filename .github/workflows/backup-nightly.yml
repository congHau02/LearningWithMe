name: Nightly Database & Redis Backup

on:
  schedule:
    # 19:00 UTC = 02:00 ICT (UTC+7) nightly
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: backup-nightly
  cancel-in-progress: false

jobs:
  backup:
    name: Dump Managed MySQL + Redis Cloud (7-Day Retention)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mysql-client and redis-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mysql-client redis-tools

      - name: Create compressed MySQL + Redis backup archive
        id: create-backup
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_DATA_REDIS_HOST: ${{ secrets.SPRING_DATA_REDIS_HOST }}
          SPRING_DATA_REDIS_PORT: ${{ secrets.SPRING_DATA_REDIS_PORT }}
          SPRING_DATA_REDIS_USERNAME: ${{ secrets.SPRING_DATA_REDIS_USERNAME }}
          SPRING_DATA_REDIS_PASSWORD: ${{ secrets.SPRING_DATA_REDIS_PASSWORD }}
          SPRING_DATA_REDIS_SSL_ENABLED: ${{ secrets.SPRING_DATA_REDIS_SSL_ENABLED }}
        run: |
          if [ -z "${SPRING_DATASOURCE_URL}" ] || [ -z "${SPRING_DATA_REDIS_HOST}" ]; then
            echo "::warning::MySQL or Redis backup secrets are not configured (SPRING_DATASOURCE_URL / SPRING_DATA_REDIS_HOST); skipping nightly backup."
            echo "archive=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARCHIVE="backups/backup-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
          bash scripts/create-backup.sh "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload backup archive to GitHub Actions Artifacts (7-day retention)
        if: ${{ steps.create-backup.outputs.archive != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-db-redis-backup-${{ github.run_id }}
          path: ${{ steps.create-backup.outputs.archive }}
          retention-days: 7
          if-no-files-found: error

      - name: Optional upload to S3 / Cloudflare R2 bucket
        if: ${{ steps.create-backup.outputs.archive != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION || 'auto' }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          ARCHIVE_PATH: ${{ steps.create-backup.outputs.archive }}
        run: |
          if [ -z "${BACKUP_S3_BUCKET}" ] || [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::notice::BACKUP_S3_BUCKET or AWS credentials are not configured; skipping S3/R2 upload."
            exit 0
          fi
          ENDPOINT_ARG=()
          if [ -n "$BACKUP_S3_ENDPOINT" ]; then
            ENDPOINT_ARG=(--endpoint-url "$BACKUP_S3_ENDPOINT")
          fi
          aws s3 cp "$ARCHIVE_PATH" "s3://${BACKUP_S3_BUCKET}/$(basename "$ARCHIVE_PATH")" "${ENDPOINT_ARG[@]}"
